[project]
name = "cuopt-scheduler"
version = "0.1.0"
description = "GPU-accelerated nurse rostering demo with NVIDIA cuOpt, PuLP and Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faker>=30",
    "pandas>=2.2",
    "plotly>=5.24",
    "pulp>=3.3,<4",  # 4.x removed LpVariable.dicts and is untested here
    "streamlit>=1.50",
]

[project.optional-dependencies]
# PuLP's CUOPT solver uses the cuOpt Python library (not the REST server).
gpu = ["cuopt-cu13==25.10.*; sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pyright>=1.1.390",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
# cuOpt 25.10 links against libcudss.so.0; cudss 0.8+ ships .so.1 and cuOpt fails to load.
constraint-dependencies = ["nvidia-cudss-cu13<0.8"]

# Not `explicit`: cuOpt's transitive RAPIDS deps (libcuopt-cu13, cuvs-cu13, ...) are only
# placeholder sdists on PyPI, so they must resolve from NVIDIA's index too. In practice only
# NVIDIA/RAPIDS packages come from here (check with `grep -B1 pypi.nvidia.com uv.lock`).
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests", "app.py"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["gpu: needs an NVIDIA GPU with cuOpt installed (skipped otherwise)"]
filterwarnings = [
    # PuLP 3.3 warns about APIs that change in 4.0 (one warning per variable). Migrating is a
    # separate piece of work; dependencies pin pulp<4 until then.
    "ignore:Constructing LpVariable:DeprecationWarning",
    "ignore:PULP_CBC_CMD is deprecated:DeprecationWarning",
    # cuOpt converts PuLP's integer coefficients to float; harmless.
    "ignore:Casting .* to float64:UserWarning",
]
