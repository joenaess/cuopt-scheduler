[project]
name = "cuopt-scheduler"
version = "0.1.0"
description = "GPU-accelerated nurse rostering demo with NVIDIA cuOpt, HiGHS and Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faker>=30",
    "highspy>=1.11",
    "numpy>=2",
    "pandas>=2.2",
    "plotly>=5.24",
    "streamlit>=1.50",
]

[project.scripts]
cuopt-bench = "cuopt_scheduler.benchmark:main"
cuopt-plots = "cuopt_scheduler.plots:main"  # needs matplotlib (dev group)

[project.optional-dependencies]
# The cuOpt Python library (not the REST server), called directly.
gpu = ["cuopt-cu13==26.10.*; sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "matplotlib>=3.9",
    "pre-commit>=4",
    "pyright>=1.1.390",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

# Not `explicit`: cuOpt's transitive RAPIDS deps (libcuopt-cu13, cuvs-cu13, ...) are only
# placeholder sdists on PyPI, so they must resolve from NVIDIA's index too. In practice only
# NVIDIA/RAPIDS packages come from here (check with `grep -B1 pypi.nvidia.com uv.lock`).
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "PIE",     # misc. lints
    "RET",     # return statements
    "PERF",    # performance anti-patterns
    "PT",      # pytest style
    "NPY",     # numpy
    "PTH",     # pathlib over os.path
    "RUF",     # ruff-specific
]
allowed-confusables = ["×", "–"]  # multiplication sign, en dash (empty table cell)

[tool.pyright]
include = ["src", "tests", "app.py"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["gpu: needs an NVIDIA GPU with cuOpt installed (skipped otherwise)"]
filterwarnings = [
    "error::DeprecationWarning:cuopt_scheduler",
]
