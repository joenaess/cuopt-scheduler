name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # CPU only: GPU tests (marked `gpu`) skip automatically. Run them locally with
    # `uv sync --extra gpu && uv run pytest`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
